name: CI

# Cada PR y cada cambio en main pasan por las mismas revisiones que se corren en local.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tipos, lint, formato, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Pruebas de punta a punta (backend real)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Bases de datos desechables: cada ejecución empieza vacía
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_ci
          POSTGRES_DB: nexusmarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexusmarket"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: nexus
          MONGO_INITDB_ROOT_PASSWORD: nexus_ci
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus_ci@localhost:5432/nexusmarket?schema=public
      MONGO_URL: mongodb://nexus:nexus_ci@localhost:27017/nexusmarket?authSource=admin
      E2E_API_URL: http://localhost:3000
      E2E_ADMIN_EMAIL: admin@ci.test
    steps:
      - uses: actions/checkout@v5

      - name: Descargar el backend (rama main)
        uses: actions/checkout@v5
        with:
          repository: CamiloCT3105/nexusmarket-backend
          ref: main
          path: backend

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Credenciales efímeras, distintas en cada ejecución (solo viven en esta máquina virtual)
      - name: Generar credenciales de prueba
        run: |
          password="$(openssl rand -hex 16)"
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$secret"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Preparar y arrancar el backend
        working-directory: backend
        env:
          PORT: "3000"
          CORS_ORIGIN: http://localhost:5173
          ADMIN_EMAIL: admin@ci.test
          ADMIN_DOCUMENT_NUMBER: "1000000000"
        # NODE_ENV=production solo al arrancar: si se define antes, npm ci omite las dependencias
        # de desarrollo (TypeScript y sus tipos) y la compilación del backend falla
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build
          ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" NODE_ENV=production nohup node dist/index.js > ../backend.log 2>&1 &
          npx --yes wait-on@8.0.5 --timeout 60000 tcp:localhost:3000

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Guardar reporte y registros si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            backend.log
          retention-days: 7
