<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NexusMarket: el marketplace que conecta compradores y vendedores." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NexusMarket</title>
    <script>
      // Aplica el tema guardado ANTES de pintar, para evitar un parpadeo de color al cargar
      (function () {
        try {
          var saved = localStorage.getItem("nexus-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
